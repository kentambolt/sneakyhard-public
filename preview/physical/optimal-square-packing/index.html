<details><summary data-da="Hvad er optimal square packing?" data-en="What is optimal square packing?"></summary><p data-da="Opgaven er at pakke ens kvadrater i det mindst mulige kvadrat. Her er rammen altid 140 × 140 mm indvendigt; brikkernes størrelse ændrer sig. Pakningerne med 5 og 10 er bevist optimale. For 17 bruger vi den bedst kendte pakning, som ikke er bevist optimal. Den kræver andre vinkler end 45°, så den er med i det fysiske sæt, men ikke i onlinedemoen." data-en="The challenge is to pack identical squares into the smallest possible square. Here the frame always measures 140 × 140 mm inside; tile sizes change. The packings for 5 and 10 are proved optimal. For 17 we use the best known packing, which has not been proved optimal. It needs angles other than 45°, so it is in the physical set but not the online demo."></p><a href="https://kingbird.myphotos.cc/packing/squares_in_squares.html" target="_blank" rel="noopener" data-da="Se de matematiske pakninger og kilder" data-en="See the mathematical packings and sources"></a></details>
<details><summary data-da="Print og pasform" data-en="Printing and fit"></summary><p data-da="Dette er ikke fysisk afprøvede produkter. Modellerne er kontrolleret digitalt, men klikstyrke, tolerancer og holdbarhed skal prøveprintes. Start med den lille pasformsprøve. Brikkerne er 5,2 mm tykke med 0,25 mm kantfas. Rammerne har 2,4 mm bund. Filer og færdigprint er tænkte købsformer; salg og betaling er endnu ikke åbnet." data-en="These products have not been physically tested. Models are checked digitally, but snap force, tolerances and durability need test prints. Start with the small fit sample. Tiles are 5.2 mm thick with a 0.25 mm edge bevel. Tray floors are 2.4 mm thick. Digital files and printed sets are planned purchase options; sales and payment are not open yet."></p></details>
<section id="demo"><div class="eyebrow" data-da="Prøv idéen" data-en="Try the idea"></div><h2 data-da="Et lille kvadrat. Overraskende lidt plads." data-en="One small square. Surprisingly little room."></h2><div class="demo-layout"><div class="demo-controls"><label><span data-da="Brikker" data-en="Tiles"></span><select id="count"><option>5</option><option>10</option></select></label><button id="rotate" data-da="Drej 45°" data-en="Rotate 45°"></button><button id="undo" data-da="Fortryd" data-en="Undo"></button><button id="reset" data-da="Start forfra" data-en="Reset"></button></div><svg id="board" viewBox="0 0 170 238" role="group" aria-label="Square packing puzzle"></svg><p id="status" role="status" aria-live="polite"></p><details><summary data-da="Sådan spiller du" data-en="How to play"></summary><p data-da="Træk de lyse brikker fra bakken ind i kvadratet. Tryk på en brik og brug Drej 45°. Brikken bliver liggende, når du slipper; overlap markeres, men er tilladt undervejs. Kanter hjælper med let snapping. Du kan også vælge en brik, trykke et sted for at placere den og flytte den fint med piletasterne. R drejer, og Ctrl+Z fortryder. Alle brikker skal helt inden for rammen uden overlap. Demoen bruger de præcise matematiske størrelser; printfilerne har lidt spillerum." data-en="Drag the light tiles from the tray into the square. Select a tile and use Rotate 45°. Tiles stay where you release them; overlaps are highlighted but allowed while arranging. Edges offer gentle snapping. You can also select a tile, tap a location and fine-tune with the arrow keys. R rotates and Ctrl+Z undoes. Fit every tile inside the frame without overlaps. The demo uses exact mathematical sizes; print files include a little clearance."></p></details></div></section>
